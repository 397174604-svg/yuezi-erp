services:
  mysql:
    image: mysql:5.7.44
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: yuezi
      MYSQL_USER: yuezi_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - yuezi_mysql_data:/var/lib/mysql
      - ./conf.d/yuezi.cnf:/etc/mysql/conf.d/yuezi.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  yuezi_mysql_data:
